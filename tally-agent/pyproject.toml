[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmos-tally-agent"
version = "0.3.0"
description = "Reads a client's Tally purchase register on their PC and sends it to Firm OS"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
firmos-tally-agent = "tally_agent.cli:main"

[tool.setuptools]
packages = ["tally_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
