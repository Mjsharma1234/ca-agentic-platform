services:
  ca-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ca_firm_os_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ca_user:ca_password@postgres:5432/ca_platform
      - SECRET_KEY=enterprise-jwt-secret-key-change-in-production-2026
      - APP_NAME=CA Firm OS Platform
      - DEBUG=false
      - CORS_ORIGINS=["https://firmosweb.vercel.app","http://localhost:3000","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ca-network

  postgres:
    image: postgres:16-alpine
    container_name: ca_firm_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ca_user
      POSTGRES_PASSWORD: ca_password
      POSTGRES_DB: ca_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca_user -d ca_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ca-network

networks:
  ca-network:
    driver: bridge

volumes:
  postgres_data:
