services:
  ca-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ca_firm_os_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Set these in a local .env file next to this compose file (never commit real values):
      #   POSTGRES_PASSWORD=<random>  SECRET_KEY=<random 32+ chars>
      - DATABASE_URL=postgresql://ca_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ca_platform
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - APP_NAME=CA Firm OS Platform
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=["https://firmosweb.vercel.app","http://localhost:3000","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ca-network

  postgres:
    image: postgres:16-alpine
    container_name: ca_firm_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ca_platform
    ports:
      # Loopback only: the DB is reachable from this machine, never from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca_user -d ca_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ca-network

networks:
  ca-network:
    driver: bridge

volumes:
  postgres_data:
